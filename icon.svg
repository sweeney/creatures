<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The three species on the diagonal. Mirrors the About dialog's icon:
       linear-gradient(135deg, grass 40%, rabbit 40% 70%, fox 70%) — doubled
       stops give hard edges instead of a blend. -->
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="40%" stop-color="#00a000"/>
    <stop offset="40%" stop-color="#0000ff"/>
    <stop offset="70%" stop-color="#0000ff"/>
    <stop offset="70%" stop-color="#ff0000"/>
  </linearGradient>
  <rect width="32" height="32" fill="url(#g)"/>
</svg>
